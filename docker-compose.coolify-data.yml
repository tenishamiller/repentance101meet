# Postgres + MinIO + backups next to Coolify.
# Do NOT start Caddy/app from docker-compose.yml on this VPS — Coolify Traefik
# already owns ports 80/443 for all four sites.
#
#   docker compose -f docker-compose.yml -f docker-compose.coolify-data.yml \
#     up -d postgres minio minio-init backup

services:
  app:
    profiles: ["standalone-vps"]
  caddy:
    profiles: ["standalone-vps"]

  postgres:
    container_name: r101-postgres
    networks:
      default: {}
      coolify:
        aliases:
          - r101-postgres

  minio:
    container_name: r101-minio
    networks:
      default: {}
      coolify:
        aliases:
          - r101-minio
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.r101-media-cache.headers.customresponseheaders.Cache-Control=public, max-age=31536000, immutable
      - traefik.http.routers.r101-media-http.entrypoints=http
      - traefik.http.routers.r101-media-http.rule=Host(`repentance101ministry.com`) && PathPrefix(`/media`)
      - traefik.http.routers.r101-media-http.middlewares=redirect-to-https
      - traefik.http.routers.r101-media-http.priority=2000
      - traefik.http.routers.r101-media-http.service=r101-media
      - traefik.http.routers.r101-media-www-http.entrypoints=http
      - traefik.http.routers.r101-media-www-http.rule=Host(`www.repentance101ministry.com`) && PathPrefix(`/media`)
      - traefik.http.routers.r101-media-www-http.middlewares=redirect-to-https
      - traefik.http.routers.r101-media-www-http.priority=2000
      - traefik.http.routers.r101-media-www-http.service=r101-media
      - traefik.http.routers.r101-media-https.entrypoints=https
      - traefik.http.routers.r101-media-https.rule=Host(`repentance101ministry.com`) && PathPrefix(`/media`)
      - traefik.http.routers.r101-media-https.middlewares=r101-media-cache
      - traefik.http.routers.r101-media-https.tls=true
      - traefik.http.routers.r101-media-https.tls.certresolver=letsencrypt
      - traefik.http.routers.r101-media-https.priority=2000
      - traefik.http.routers.r101-media-https.service=r101-media
      - traefik.http.routers.r101-media-www-https.entrypoints=https
      - traefik.http.routers.r101-media-www-https.rule=Host(`www.repentance101ministry.com`) && PathPrefix(`/media`)
      - traefik.http.routers.r101-media-www-https.middlewares=r101-media-cache
      - traefik.http.routers.r101-media-www-https.tls=true
      - traefik.http.routers.r101-media-www-https.tls.certresolver=letsencrypt
      - traefik.http.routers.r101-media-www-https.priority=2000
      - traefik.http.routers.r101-media-www-https.service=r101-media
      - traefik.http.services.r101-media.loadbalancer.server.port=9000
      - traefik.http.services.r101-media.loadbalancer.passhostheader=true

  minio-init:
    networks:
      - default
      - coolify

  backup:
    container_name: r101-backup
    networks:
      - default
      - coolify
    environment:
      POSTGRES_HOST: postgres

networks:
  coolify:
    external: true
